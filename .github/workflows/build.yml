name: Build SK ESPORTS APK
# Rebuild after reward-history Dart syntax fix

on:
  push:
    branches: [ mega-update-v1 ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: flutter create . --platforms=android
      - run: python3 -c 'p="android/app/src/main/AndroidManifest.xml"; s=open(p).read(); open(p,"w").write(s.replace("\x3capplication", "\x3cuses-permission android:name=\"android.permission.INTERNET\"/\x3e\n    \x3capplication"))'
      - run: flutter pub get
      - run: flutter --version
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: SK-ESPORTS-App
          path: build/app/outputs/flutter-apk/app-release.apk
          
