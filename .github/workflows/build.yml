name: Build SK ESPORTS APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: flutter create . --platforms=android
      - run: sed -i '/android:label/i \    \x3cuses-permission android:name="android.permission.INTERNET"/\x3e' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: SK-ESPORTS-App
          path: build/app/outputs/flutter-apk/app-release.apk
          
