name: Build SK ESPORTS APK

on:
  push:
    branches: [ mega-update-v1 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - run: flutter create . --platforms=android

      - name: Add internet permission
        run: |
          python3 - <<'PY'
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          permission = '<uses-permission android:name="android.permission.INTERNET"/>'
          if permission not in s:
              s = s.replace("<application", permission + "\\n    <application", 1)
          open(p, "w", encoding="utf-8").write(s)
          PY

      - name: Configure permanent release signing (when secrets exist)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ]; then
            echo "::warning::Permanent signing secrets are not configured. This build is NOT signed with the permanent app key; Google Sign-In SHA-1 will not be stable."
            exit 0
          fi

          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/sk-esports-release.jks
          test -s android/app/sk-esports-release.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=app/sk-esports-release.jks
          EOF

          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/app/build.gradle.kts")
          if not p.exists():
              raise SystemExit("Expected Kotlin Gradle file android/app/build.gradle.kts was not generated.")
          s = p.read_text()
          if 'val keystoreProperties = Properties()' not in s:
              s = 'import java.util.Properties\\n\\nval keystoreProperties = Properties()\\nval keystorePropertiesFile = rootProject.file("key.properties")\\nif (keystorePropertiesFile.exists()) {\\n    keystoreProperties.load(keystorePropertiesFile.inputStream())\\n}\\n\\n' + s
          if 'create("release")' not in s:
              s = s.replace('    defaultConfig {', '''    signingConfigs {
          create("release") {
              keyAlias = keystoreProperties["keyAlias"] as String
              keyPassword = keystoreProperties["keyPassword"] as String
              storeFile = file(keystoreProperties["storeFile"] as String)
              storePassword = keystoreProperties["storePassword"] as String
          }
      }
      
      defaultConfig {''', 1)
          # Add the signing config inside the generated release build type.
          if 'signingConfig = signingConfigs.getByName("release")' not in s:
              m = re.search(r'buildTypes\\s*\\{\\s*getByName\\("release"\\)\\s*\\{', s)
              if not m:
                  m = re.search(r'buildTypes\\s*\\{\\s*release\\s*\\{', s)
              if not m:
                  s = s.replace('    defaultConfig {', '''    buildTypes {
          getByName("release") {
              signingConfig = signingConfigs.getByName("release")
          }
      }
      
      defaultConfig {''', 1)
              else:
                  s = s[:m.end()] + '\\n            signingConfig = signingConfigs.getByName("release")' + s[m.end():]
          p.write_text(s)
          PY

          echo "Permanent keystore configured."
          keytool -list -v -keystore android/app/sk-esports-release.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" | grep -E "SHA1:|SHA256:"

      - run: flutter pub get
      - run: flutter --version
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: SK-ESPORTS-App
          path: build/app/outputs/flutter-apk/app-release.apk
