name: Build SK ESPORTS APK

on:
  push:
    branches: [ mega-update-v1 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - run: flutter create . --platforms=android

      - name: Add internet permission
        run: |
          python3 - <<'PY'
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          permission = '<uses-permission android:name="android.permission.INTERNET"/>'
          if permission not in s:
              s = s.replace("<application", permission + "\n    <application", 1)
          open(p, "w", encoding="utf-8").write(s)
          PY

      # Release uses Flutter's generated default signing config.
      # No keystore secrets are required. Google Sign-In is intentionally removed.

      - run: flutter pub get
      - run: flutter --version
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: SK-ESPORTS-App
          path: build/app/outputs/flutter-apk/app-release.apk
