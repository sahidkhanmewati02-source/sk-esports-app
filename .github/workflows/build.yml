name: Build SK ESPORTS APK

on:
  push:
    branches: [ mega-update-v1 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - run: flutter create . --platforms=android

      - name: Add internet permission
        run: |
          python3 - <<'PY'
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          permission = '<uses-permission android:name="android.permission.INTERNET"/>'
          if permission not in s:
              s = s.replace("<application", permission + "\n    <application", 1)
          open(p, "w", encoding="utf-8").write(s)
          PY

      - name: Configure permanent release signing (when secrets exist)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ]; then
            echo "::error::One or more permanent signing secrets are missing. Add all three repository secrets before building."
            exit 1
          fi

          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/sk-esports-release.jks
          test -s android/app/sk-esports-release.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=sk-esports-release.jks
          EOF

          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          if not p.exists():
              raise SystemExit("android/app/build.gradle.kts not found after flutter create.")
          s = p.read_text()
          if "val keystoreProperties = Properties()" not in s:
              preamble = """import java.util.Properties

          val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(keystorePropertiesFile.inputStream())
          }

          """
              s = preamble + s
          if 'create("release")' not in s:
              block = """    signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                      storeFile = file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["storePassword"] as String
                  }
              }

          """
              s = s.replace("    defaultConfig {", block + "    defaultConfig {", 1)
          s = s.replace('signingConfig = signingConfigs.getByName("debug")',
                        'signingConfig = signingConfigs.getByName("release")')
          if 'signingConfig = signingConfigs.getByName("release")' not in s:
              marker = '    buildTypes {'
              if marker not in s:
                  raise SystemExit("Could not find buildTypes block to apply release signing.")
              s = s.replace(marker, marker + '\n        getByName("release") {\n            signingConfig = signingConfigs.getByName("release")\n        }', 1)
          p.write_text(s)
          PY

          echo "Permanent keystore configured. SHA fingerprints:"
          keytool -list -v -keystore android/app/sk-esports-release.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" | grep -E "SHA1:|SHA256:"

      - run: flutter pub get
      - run: flutter --version
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: SK-ESPORTS-App
          path: build/app/outputs/flutter-apk/app-release.apk
